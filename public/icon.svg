<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1f2937" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <!-- Glowing Hexagonal Grid/Symmetry Outer Line -->
  <polygon points="256,70 416,162 416,350 256,442 96,350 96,162" fill="none" stroke="url(#glowGrad)" stroke-width="12" filter="url(#glow)" opacity="0.4" />
  <polygon points="256,80 406,168 406,344 256,432 106,344 106,168" fill="none" stroke="url(#accentGrad)" stroke-width="8" />
  <!-- Central Connectivity Symbol (Symmetric and Modern) -->
  <g filter="url(#glow)">
    <!-- Central Node -->
    <circle cx="256" cy="256" r="48" fill="url(#accentGrad)" />
    <!-- Outer Connecting Nodes -->
    <circle cx="256" cy="150" r="24" fill="#06b6d4" />
    <circle cx="348" cy="310" r="24" fill="#10b981" />
    <circle cx="164" cy="310" r="24" fill="#3b82f6" />
    <!-- Connecting Lines / Roads -->
    <line x1="256" y1="150" x2="256" y2="256" stroke="#06b6d4" stroke-width="10" stroke-linecap="round" />
    <line x1="348" y1="310" x2="256" y2="256" stroke="#10b981" stroke-width="10" stroke-linecap="round" />
    <line x1="164" y1="310" x2="256" y2="256" stroke="#3b82f6" stroke-width="10" stroke-linecap="round" />
  </g>
  <!-- Central Accent -->
  <circle cx="256" cy="256" r="20" fill="#ffffff" opacity="0.9" />
</svg>
